<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
  <filter id="ntGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.6" result="b"></feGaussianBlur>
    <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
  </filter>
  <filter id="ntGlowSoft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
    <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
  </filter>
  <pattern id="ntGrid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#0c1826" stroke-width="0.6"></path>
  </pattern>
  <radialGradient id="ntVig" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#04070d" stop-opacity="0"></stop>
    <stop offset="100%" stop-color="#04070d" stop-opacity="0.85"></stop>
  </radialGradient>

  
</defs>

<rect x="0" y="0" width="1600" height="900" fill="#04070d"></rect>
<rect x="0" y="0" width="1600" height="900" fill="url(#ntGrid)"></rect>
<g id="net"></g>
<rect x="0" y="0" width="1600" height="900" fill="url(#ntVig)" pointer-events="none"></rect>


</svg>